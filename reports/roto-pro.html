<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dangerfest 2026 – Coming Soon</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 35%, rgba(125,0,0,.30), transparent 38%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 7px),
      #050505;
    color: #f4f4f4;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Arial, sans-serif;
  }
  .panel {
    width: min(760px, 100%);
    padding: clamp(30px, 7vw, 70px) clamp(22px, 6vw, 60px);
    text-align: center;
    background: linear-gradient(180deg, rgba(24,24,24,.96), rgba(5,5,5,.98));
    border: 2px solid #aaa;
    outline: 1px solid #333;
    box-shadow: 0 0 0 7px #080808, 0 18px 60px #000;
    position: relative;
  }
  .panel::before, .panel::after {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    height: 3px;
    background: #b20d13;
  }
  .panel::before { top: 18px; }
  .panel::after { bottom: 18px; }
  .eyebrow {
    margin: 0 0 12px;
    color: #d51d24;
    font-family: Arial, sans-serif;
    font-size: clamp(12px, 2vw, 15px);
    font-weight: 800;
    letter-spacing: .34em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: clamp(54px, 12vw, 110px);
    line-height: .9;
    letter-spacing: .025em;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 #111, 0 0 18px rgba(255,255,255,.08);
  }
  .rule {
    width: min(330px, 75%);
    height: 3px;
    margin: 24px auto;
    background: #b20d13;
  }
  p {
    margin: 0 auto 30px;
    max-width: 520px;
    font-family: Arial, sans-serif;
    font-size: clamp(16px, 2.5vw, 20px);
    line-height: 1.55;
    color: #cfcfcf;
  }
  .back {
    display: inline-block;
    min-width: 220px;
    padding: 16px 28px;
    border: 2px solid #ddd;
    background:
      linear-gradient(rgba(120,0,0,.78), rgba(75,0,0,.9)),
      #750006;
    color: #fff;
    text-decoration: none;
    font-size: 24px;
    letter-spacing: .08em;
    text-transform: uppercase;
    box-shadow: inset 0 0 0 3px #330003, 0 5px 0 #260002;
  }
  .back:hover { filter: brightness(1.2); }
  .back:active { transform: translateY(2px); box-shadow: inset 0 0 0 3px #330003, 0 3px 0 #260002; }
  .back:focus-visible { outline: 3px solid white; outline-offset: 5px; }
  .footer {
    margin-top: 34px;
    color: #777;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main class="panel">
    <div class="eyebrow">Dangerfest 2026 • Game Report</div>
    <h1>Coming<br>Soon</h1>
    <div class="rule"></div>
    <p>This event's score report hasn't been posted yet. Check back after the game is complete for official results.</p>
    <a class="back" href="../index.html">← Back to Game Reports</a>
    <div class="footer">Throw • Compete • Connect • Repeat</div>
  </main>
</body>
</html>
